<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Navigation Bar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.11.2/core.css" />
</head>
<body>
    <div id="output"></div>
    <nav class="navbar">
        <div class="logo"><a href="#">Studify01</a></div>
        <ul class="nav-links" id="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Past Papers</a></li>
            <li><a href="#">Books</a></li>
            <li><a href="#">Notes</a></li>
            <li><a href="#">Quizzes</a></li>
        </ul>
        <div class="hamburger" id="hamburger">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </nav>
       <script type="module" src="https://pyscript.net/releases/2025.11.2/core.js"></script>
    <py-script>
from pyscript import Element, when

@when("click", "#hamburger")
def toggle(event):
    nav = Element("nav-links")
    nav.element.classList.toggle("active")
    print("Toggled:", nav.element.classList)
</py-script>
</body>
</html>
